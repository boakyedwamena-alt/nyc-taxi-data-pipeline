version: 2

models:
  - name: stg_yellow_trips
    columns:
      - name: trip_id
        data_tests: [not_null]
      - name: pickup_datetime
        data_tests: [not_null]
      - name: payment_type_id
        data_tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]
  - name: stg_zones
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
  - name: stg_weather
    columns:
      - name: weather_hour
        data_tests: [unique, not_null]
