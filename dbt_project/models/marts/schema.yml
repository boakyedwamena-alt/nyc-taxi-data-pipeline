version: 2

models:
  - name: fact_trips
    description: One row per valid yellow-taxi trip (grain = trip). Incremental by source month.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pickup_zone_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_zone'), field: zone_id}
      - name: dropoff_zone_id
        data_tests:
          - relationships: {to: ref('dim_zone'), field: zone_id}
      - name: payment_type_id
        data_tests:
          - relationships: {to: ref('dim_payment'), field: payment_type_id}
      - name: pickup_date
        data_tests:
          - relationships: {to: ref('dim_date'), field: date_id}
  - name: dim_zone
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_id
        data_tests: [unique, not_null]
  - name: dim_payment
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]
  - name: dim_weather
    columns:
      - name: weather_hour
        data_tests: [unique, not_null]
  - name: mart_weather_impact
    columns:
      - name: weather_category
        data_tests: [unique, not_null]
